name: CI

on: [push, pull_request]

env:
  VERILATOR_VERSION: v5.049.26417585458
  VERILATOR_URL: https://github.com/EDAPack/verilator-bin/releases/download/v5.049.26417585458/verilator-manylinux_2_34_x86_64-master.26417585458.tar.gz
  VERILATOR_SHA256: 80e9712b05d58e3c46510c850206345b078700ed4c3283f944f64013fca37318

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Install g++ 10
        run: sudo apt-get install -y g++-10
            && echo "CXX=g++-10" >> "$GITHUB_ENV"

      - name: Install Verilator dependencies
        run: |
            sudo apt-get install -y \
                curl

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v3
        with:
          path: /opt/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-${{ runner.os }}

      - name: Download Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
            curl -fL "${VERILATOR_URL}" -o /tmp/verilator.tar.gz
            echo "${VERILATOR_SHA256}  /tmp/verilator.tar.gz" | sha256sum -c
            sudo rm -rf /opt/verilator
            sudo mkdir -p /opt/verilator
            sudo tar -xzf /tmp/verilator.tar.gz --strip-components=1 -C /opt/verilator

      - name: Add Verilator to $PATH
        run: echo "/opt/verilator/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.8"

      - name: Install direnv
        run: sudo apt-get install -y direnv

      - name: Run tests
        run: |
          cd test
          direnv allow
          direnv exec . pytest -n auto
